---
- name: Install Docker and Docker Compose
  hosts: vps
  become: yes
  vars:
    app_user: "n8n"

  tasks:
    - name: Ensure dependencies are installed 
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
        state: present
        update_cache: yes

    - name: Create directory for Docker GPG key # Prepares the standard Debian/Ubuntu directory for secure repository keys
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Download Docker GPG key # Fetches Docker's official public key to verify package authenticity
      get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /tmp/docker.gpg

    - name: Dearmor Docker GPG key # Converts the downloaded key into a format readable by apt
      command: gpg --dearmor -o /etc/apt/keyrings/docker.gpg /tmp/docker.gpg
      args:
        creates: /etc/apt/keyrings/docker.gpg # Skips this task if the dearmored key already exists

    - name: Get dpkg architecture # Dynamically detects if the VPS is using AMD64, ARM, etc.
      command: dpkg --print-architecture
      register: dpkg_arch # Saves the command output into a variable
      changed_when: false # Tells Ansible this command doesn't modify the system

    - name: Get lsb_release # Dynamically detects the Ubuntu codename (e.g., jammy, focal)
      command: lsb_release -cs
      register: lsb_release
      changed_when: false

    - name: Add Docker repository # Injects the official Docker repo into the system's package manager sources
      apt_repository:
        repo: "deb [arch={{ dpkg_arch.stdout }} signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu {{ lsb_release.stdout }} stable"
        state: present
        filename: docker

    - name: Install Docker packages # Installs the core engine, CLI, container runtime, and the Compose plugin
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present
        update_cache: yes

    - name: Add app user to docker group # Grants the n8n user permission to execute Docker commands without typing 'sudo'
      user:
        name: "{{ app_user }}"
        groups: docker
        append: yes # Crucial: Adds to the group without removing the user from existing groups like 'sudo'